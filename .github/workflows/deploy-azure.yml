name: deploy-azure.yml
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -input=false

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false

      - name: Fetch VM IP from Terraform
        id: tf-output
        run: |
          VM_IP=$(terraform output -raw vm_public_ip)
          echo "AZURE_VM_IP=$VM_IP" >> $GITHUB_ENV

      - name: Set up SSH Agent (for Ansible connection)
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          if_key_exists: replace
          known_hosts: "placeholder"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      - name: Run Ansible Playbook
        run: |
          ansible-playbook ansible/playbook.yml \
            -i "${{ env.AZURE_VM_IP }}," \
            --user devops-admin \
            --extra-vars "github_token='${{ secrets.AZURE_PULL_PAT }}' ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'"