name: Continuous Integration

on:
  push: {}

jobs:
  openapi-lint:
    name: Lint OpenAPI Specs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Redocly Lint
        run: npx @redocly/cli lint api/*.yaml --format=github-actions

  python-lint:
    name: Lint Python (GenAI Service)
    needs: openapi-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: services/genai-service/requirements.txt

      - name: Install Dependencies & Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          pip install -r services/genai-service/requirements.txt

      - name: Run Ruff Linter
        run: ruff check services/genai-service

  backend-test:
    name: Build & Test Backend - ${{ matrix.service }}
    needs: openapi-lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - user-service
          - checklist-service
          - calendar-service
          - note-service
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21 (Corretto)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: maven

      - name: Build & Test with Maven
        run: |
          mvn clean install -f services/shared/pom.xml
          cd services/${{ matrix.service }}
          mvn clean verify

      - name: Static Analysis with Spotbugs
        run: |
          cd services/${{ matrix.service }}
          mvn compile spotbugs:check

  frontend-test:
    name: Build & Test Frontend
    needs: openapi-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web-client/package-lock.json

      - name: Install Dependencies
        run: npm --prefix web-client ci

      - name: Run TypeScript Typecheck
        run: npm --prefix web-client run typecheck

      - name: Run Frontend Tests
        run: npm --prefix web-client run test

      - name: Build Production Bundle
        run: npm --prefix web-client run build
