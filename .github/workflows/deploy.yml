name: Build & Deploy to AET

on:
  push:
    branches: [release]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - service: user-service
            context: ./services/user-service
          - service: admin-service
            context: ./services/admin-service
          - service: checklist-service
            context: ./services/checklist-service
          - service: calendar-service
            context: ./services/calendar-service
          - service: note-service
            context: ./services/note-service
          - service: genai-service
            context: ./services/genai-service
          - service: client
            context: ./web-client
            build_args: VITE_API_URL=/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/aet-devops26/team-devopss26/${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/aet-devops26/team-devopss26/${{ matrix.service }}:${{ github.sha }}
          build-args: ${{ matrix.build_args }}

  deploy-to-k8s:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config

      - name: Deploy with Helm
        run: |
          helm upgrade --install prod ./infra/iac/aet \
            --namespace prod \
            --create-namespace \
            --set global.imageTag=${{ github.sha }} \
            --set genaiService.geminiApiKey=${{ secrets.GEMINI_API_KEY }} \
            --set ingress.host=${{ vars.INGRESS_HOST }} \
            -f infra/iac/aet/values-prod.yaml \
            --wait --timeout 5m
