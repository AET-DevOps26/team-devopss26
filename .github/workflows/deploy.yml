name: Build & Deploy to AET

on:
  workflow_run:
    workflows: ["Continuous Integration"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  HELM_RELEASE: devopss26
  NAMESPACE: team-devopss26-prod

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Detect changed services ─────────────────────────────────
  detect:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    outputs:
      services: ${{ steps.build-matrix.outputs.services }}
      skip-tags: ${{ steps.build-matrix.outputs['skip-tags'] }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            user-service:
              - 'services/user-service/**'
            checklist-service:
              - 'services/checklist-service/**'
            calendar-service:
              - 'services/calendar-service/**'
            note-service:
              - 'services/note-service/**'
            genai-service:
              - 'services/genai-service/**'
            client:
              - 'web-client/**'
            shared:
              - 'services/shared/**'
            api:
              - 'api/**'

      - name: Build service matrix
        id: build-matrix
        uses: actions/github-script@v7
        with:
          script: |
            const ALL = [
              {service: "user-service",    context: "./",               dockerfile: "./services/user-service/Dockerfile"},
              {service: "checklist-service", context: "./",             dockerfile: "./services/checklist-service/Dockerfile"},
              {service: "calendar-service", context: "./",              dockerfile: "./services/calendar-service/Dockerfile"},
              {service: "note-service",    context: "./",               dockerfile: "./services/note-service/Dockerfile"},
              {service: "genai-service",   context: "./",               dockerfile: "./services/genai-service/Dockerfile"},
              {service: "client",          context: "./",               dockerfile: "./web-client/Dockerfile"}
            ];
            const ALL_NAMES = ALL.map(s => s.service);
            const REGISTRY = 'ghcr.io/aet-devops26/team-devopss26';

            // Manual trigger: build everything, nothing to skip-tag
            if (context.eventName === 'workflow_dispatch') {
              core.setOutput('services', JSON.stringify(ALL));
              core.setOutput('skip-tags', JSON.stringify([]));
              return;
            }

            const changed = ${{ toJSON(steps.filter.outputs) }};
            const services = [];
            const javaServices = ['user-service', 'checklist-service', 'calendar-service', 'note-service'];

            // Shared/api changes cascade to all Java services
            if (changed.shared === 'true' || changed.api === 'true') {
              javaServices.forEach(s => services.push(ALL.find(a => a.service === s)));
            } else {
              javaServices.forEach(s => {
                if (changed[s] === 'true') services.push(ALL.find(a => a.service === s)));
              });
            }

            // GenAI and client are independent
            for (const s of ['genai-service', 'client']) {
              if (changed[s] === 'true') services.push(ALL.find(a => a.service === s)));
            }

            // Fallback: if nothing was detected (helm-only, infra, etc.), build all
            if (services.length === 0) {
              core.setOutput('services', JSON.stringify(ALL));
              core.setOutput('skip-tags', JSON.stringify([]));
              return;
            }

            core.setOutput('services', JSON.stringify(services));

            // Skipped services: copy latest→SHA tag so Helm can pull
            const builtNames = services.map(s => s.service);
            const skippedNames = ALL_NAMES.filter(n => !builtNames.includes(n));
            const skipTags = skippedNames.map(n => `${REGISTRY}/${n}`);
            core.setOutput('skip-tags', JSON.stringify(skipTags));

  # ── Build & push only the changed services ──────────────────
  build-and-push:
    needs: detect
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service: ${{ fromJSON(needs.detect.outputs.services) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push ${{ matrix.service.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/aet-devops26/team-devopss26/${{ matrix.service.service }}:latest
            ${{ env.REGISTRY }}/aet-devops26/team-devopss26/${{ matrix.service.service }}:${{ github.sha }}

  # ── Tag skipped services with SHA (copy latest→SHA) ─────────
  tag-skipped:
    needs: detect
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Tag skipped images with SHA
        if: ${{ needs.detect.outputs['skip-tags'] != '[]' }}
        shell: bash
        run: |
          SKIP_TAGS='${{ needs.detect.outputs['skip-tags'] }}'
          echo "Skipped images to tag: $SKIP_TAGS"
          for img in $(echo "$SKIP_TAGS" | jq -r '.[]'); do
            echo "Tagging $img:${{ github.sha }} ← $img:latest"
            docker buildx imagetools create \
              --tag "$img:${{ github.sha }}" \
              "$img:latest"
          done

  # ── Deploy to AET cluster ───────────────────────────────────
  deploy-to-k8s:
    needs: [detect, build-and-push, tag-skipped]
    if: ${{ needs.build-and-push.result == 'success' && needs.tag-skipped.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.2.3

      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
          kubectl config current-context

      - name: Create or update secrets from GitHub Secrets
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NAMESPACE: ${{ env.NAMESPACE }}
        run: |
          set -euo pipefail

          echo ">> Creating postgres-secret"
          kubectl create secret generic postgres-secret \
            -n "$NAMESPACE" \
            --from-literal=POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -

          echo ">> Creating service secrets"
          for svc in user-service checklist-service calendar-service note-service; do
            svc_upper=$(echo "$svc" | tr '-' '_' | tr '[:lower:]' '[:upper:]')
            kubectl create secret generic "${svc}-secret" \
              -n "$NAMESPACE" \
              --from-literal=SERVICES_POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
              --from-literal="${svc_upper}_POSTGRES_PASSWORD=$POSTGRES_PASSWORD" \
              --dry-run=client -o yaml | kubectl apply -f -
          done

          echo ">> Creating genai-service-secret"
          kubectl create secret generic genai-service-secret \
            -n "$NAMESPACE" \
            --from-literal=SERVICES_POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            --from-literal=GENAI_SERVICE_POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            --from-literal=GEMINI_API_KEY="$GEMINI_API_KEY" \
            --dry-run=client -o yaml | kubectl apply -f -

          echo ">> Verifying all secrets exist"
          for svc in postgres user-service checklist-service calendar-service note-service genai-service; do
            kubectl get secret "${svc}-secret" -n "$NAMESPACE" || {
              echo "ERROR: ${svc}-secret not found"; exit 1;
            }
          done
          echo ">> All secrets verified."

      - name: Deploy with Helm
        env:
          INGRESS_HOST: ${{ vars.INGRESS_HOST }}
        run: |
          set -euo pipefail

          helm upgrade --install $HELM_RELEASE ./infra/iac/aet \
            --namespace "$NAMESPACE" \
            --create-namespace \
            --wait \
            --timeout 15m \
            --history-max 10 \
            --set global.imageTag=${{ github.sha }} \
            --set ingress.host="$INGRESS_HOST" \
            -f infra/iac/aet/values-prod.yaml

      - name: Verify deployment
        run: |
          echo ">> Checking pods"
          kubectl get pods -n "$NAMESPACE" -o wide
          echo ""
          echo ">> Checking deployments"
          kubectl get deploy -n "$NAMESPACE"

      - name: Diagnose on failure
        if: failure()
        run: |
          echo "::group::Pods"
          kubectl get pods -n "$NAMESPACE" -o wide || true
          echo "::endgroup::"
          echo "::group::Recent events"
          kubectl get events -n "$NAMESPACE" --sort-by='.lastTimestamp' | tail -30 || true
          echo "::endgroup::"
          echo "::group::Helm status"
          helm status $HELM_RELEASE -n "$NAMESPACE" || true
          echo "::endgroup::"
          echo "::group::Helm history"
          helm history $HELM_RELEASE -n "$NAMESPACE" || true
          echo "::endgroup::"
