name: Build & Deploy to AET

on:
  workflow_run:
    workflows: ["Continuous Integration"]
    types:
      - completed
    branches:
      - release
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - service: user-service
            context: ./
            dockerfile: ./services/user-service/Dockerfile
          - service: admin-service
            context: ./
            dockerfile: ./services/admin-service/Dockerfile
          - service: checklist-service
            context: ./
            dockerfile: ./services/checklist-service/Dockerfile
          - service: calendar-service
            context: ./
            dockerfile: ./services/calendar-service/Dockerfile
          - service: note-service
            context: ./
            dockerfile: ./services/note-service/Dockerfile
          - service: genai-service
            context: ./services/genai-service
            dockerfile: ./services/genai-service/Dockerfile
          - service: client
            context: ./
            dockerfile: ./web-client/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/aet-devops26/team-devopss26/${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/aet-devops26/team-devopss26/${{ matrix.service }}:${{ github.sha }}
          build-args: ${{ matrix.build_args }}

  deploy-to-k8s:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config
          echo "Kubeconfig written. Testing access..."
          kubectl auth can-i get namespaces 2>&1 || true
          kubectl auth can-i get pods -n team-devopss26-prod 2>&1 || true

      - name: Deploy with Helm
        env:
          INGRESS_HOST: ${{ vars.INGRESS_HOST }}
        run: |
          cat > /tmp/genai-values.yaml << EOF
          genaiService:
            geminiApiKey: ${{ secrets.GEMINI_API_KEY }}
          EOF
          helm upgrade --install devopss26 ./infra/iac/aet \
            --namespace team-devopss26-prod \
            --create-namespace \
            --atomic \
            --set global.imageTag=${{ github.sha }} \
            --set ingress.host="$INGRESS_HOST" \
            -f infra/iac/aet/values-prod.yaml \
            -f /tmp/genai-values.yaml \
            --timeout 5m
          rm -f /tmp/genai-values.yaml

      - name: Wait for rollout
        run: |
          DEPLOYMENTS=$(kubectl get deployment -n team-devopss26-prod --no-headers -o name | sed 's|deployment.apps/||' | sort)
          for deploy in $DEPLOYMENTS; do
            echo "Waiting for $deploy..."
            kubectl rollout status deployment/$deploy -n team-devopss26-prod --timeout=5m
          done
          echo "Waiting for postgres..."
          kubectl rollout status statefulset/postgres -n team-devopss26-prod --timeout=5m
          echo "All deployments rolled out!"

      - name: Verify deployment
        run: |
          TAG="${{ github.sha }}"
          echo "Checking pods are running image tag: $TAG"
          kubectl get pods -n team-devopss26-prod -o wide
          echo ""
          MISMATCH=0
          for pod in $(kubectl get pods -n team-devopss26-prod --no-headers -o name); do
            IMAGES=$(kubectl get -n team-devopss26-prod "$pod" -o jsonpath='{range .spec.containers[*]}{.image}{"\n"}{end}')
            while IFS= read -r img; do
              case "$img" in
                *postgres*) ;;  # skip postgres (public Docker Hub image)
                *:$TAG) ;;       # correct tag
                *)
                  echo "::warning::$pod has wrong image: $img (expected tag: $TAG)"
                  MISMATCH=$((MISMATCH + 1))
                  ;;
              esac
            done <<< "$IMAGES"
          done
          if [ "$MISMATCH" -gt 0 ]; then
            echo "::error::$MISMATCH pods have wrong image tag"
            exit 1
          fi
          echo "All pods running expected images!"
