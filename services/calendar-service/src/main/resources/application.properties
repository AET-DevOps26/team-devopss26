spring.application.name=calendar-service

# Environment variable defaults
CALENDAR_SERVICE_APP_PORT=8004

server.port=${CALENDAR_SERVICE_APP_PORT}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${SERVICES_POSTGRES_URL}:${SERVICES_POSTGRES_PORT_INT}/calendar_service_db
spring.datasource.username=${SERVICES_POSTGRES_USER}
spring.datasource.password=${SERVICES_POSTGRES_PASSWORD}

spring.liquibase.change-log=db/changelog/db.changelog-master.xml

management.endpoints.web.exposure.include=prometheus,health
management.prometheus.metrics.export.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.endpoint.health.show-details=when_authorized
# JWT configuration
user-service.url=${USER_SERVICE_URL:http://localhost:8001}