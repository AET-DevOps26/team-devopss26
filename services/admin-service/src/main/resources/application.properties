spring.application.name=admin-service
server.port=${ADMIN_SERVICE_APP_PORT}
server.servlet.context-path=/api/admin

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${ADMIN_SERVICE_POSTGRES_URL}:${ADMIN_SERVICE_POSTGRES_PORT_INT}/${ADMIN_SERVICE_POSTGRES_DB}
spring.datasource.username=${ADMIN_SERVICE_POSTGRES_USER}
spring.datasource.password=${ADMIN_SERVICE_POSTGRES_PASSWORD}

spring.liquibase.change-log=db/changelog/db.changelog-master.xml

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always