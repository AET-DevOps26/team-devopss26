spring.application.name=admin-service

# Environment variable defaults
ADMIN_SERVICE_APP_PORT=8002
ADMIN_SERVICE_POSTGRES_URL=admin-service-db
ADMIN_SERVICE_POSTGRES_PORT_INT=5432
ADMIN_SERVICE_POSTGRES_DB=public
ADMIN_SERVICE_POSTGRES_USER=admin
ADMIN_SERVICE_POSTGRES_PASSWORD=admin

server.port=${ADMIN_SERVICE_APP_PORT}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${SERVICES_POSTGRES_URL}:${SERVICES_POSTGRES_PORT_INT}/admin_service_db
spring.datasource.username=${SERVICES_POSTGRES_USER}
spring.datasource.password=${SERVICES_POSTGRES_PASSWORD}

spring.liquibase.change-log=db/changelog/db.changelog-master.xml

management.endpoints.web.exposure.include=prometheus,health
management.prometheus.metrics.export.enabled=true