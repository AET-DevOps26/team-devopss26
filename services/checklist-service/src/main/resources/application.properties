spring.application.name=checklist-service

# Environment variable defaults
CHECKLIST_SERVICE_APP_PORT=8003
CHECKLIST_SERVICE_POSTGRES_URL=checklist-service-db
CHECKLIST_SERVICE_POSTGRES_PORT_INT=5432
CHECKLIST_SERVICE_POSTGRES_DB=public
CHECKLIST_SERVICE_POSTGRES_USER=admin
CHECKLIST_SERVICE_POSTGRES_PASSWORD=admin

server.port=${CHECKLIST_SERVICE_APP_PORT}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${SERVICES_POSTGRES_URL}:${SERVICES_POSTGRES_PORT_INT}/checklist_service_db
spring.datasource.username=${SERVICES_POSTGRES_USER}
spring.datasource.password=${SERVICES_POSTGRES_PASSWORD}

spring.liquibase.change-log=db/changelog/db.changelog-master.xml

management.endpoints.web.exposure.include=prometheus,health
management.prometheus.metrics.export.enabled=true

# JWT configuration
user-service.url=http://localhost:8001