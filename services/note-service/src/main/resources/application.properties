spring.application.name=note-service

# Environment variable defaults
NOTE_SERVICE_APP_PORT=8005
NOTE_SERVICE_POSTGRES_URL=note-service-db
NOTE_SERVICE_POSTGRES_PORT_INT=5432
NOTE_SERVICE_POSTGRES_DB=public
NOTE_SERVICE_POSTGRES_USER=admin
NOTE_SERVICE_POSTGRES_PASSWORD=admin

server.port=${NOTE_SERVICE_APP_PORT}
server.servlet.context-path=/api/note

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${SERVICES_POSTGRES_URL}:${SERVICES_POSTGRES_PORT_INT}/note_service_db
spring.datasource.username=${SERVICES_POSTGRES_USER}
spring.datasource.password=${SERVICES_POSTGRES_PASSWORD}

spring.liquibase.change-log=db/changelog/db.changelog-master.xml

management.endpoints.web.exposure.include=prometheus,health
management.prometheus.metrics.export.enabled=true
management.endpoint.health.show-details=when_authorized