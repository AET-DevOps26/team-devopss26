spring.application.name=user-service

# Environment variable defaults
USER_SERVICE_APP_PORT=8001
USER_SERVICE_POSTGRES_URL=user-service-db
USER_SERVICE_POSTGRES_PORT_INT=5432
USER_SERVICE_POSTGRES_DB=public
USER_SERVICE_POSTGRES_USER=admin
USER_SERVICE_POSTGRES_PASSWORD=admin

server.port=${USER_SERVICE_APP_PORT}
server.servlet.context-path=/api/user

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${USER_SERVICE_POSTGRES_URL}:${USER_SERVICE_POSTGRES_PORT_INT}/${USER_SERVICE_POSTGRES_DB}
spring.datasource.username=${USER_SERVICE_POSTGRES_USER}
spring.datasource.password=${USER_SERVICE_POSTGRES_PASSWORD}

spring.liquibase.change-log=db/changelog/db.changelog-master.xml

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always