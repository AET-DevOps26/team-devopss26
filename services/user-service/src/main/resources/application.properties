spring.application.name=user-service
server.port=${USER_SERVICE_APP_PORT}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${USER_SERVICE_POSTGRES_URL}:${USER_SERVICE_POSTGRES_PORT_INT}/${USER_SERVICE_POSTGRES_DB}
spring.datasource.username=${USER_SERVICE_POSTGRES_USER}
spring.datasource.password=${USER_SERVICE_POSTGRES_PASSWORD}

spring.liquibase.change-log=db/changelog/db.changelog-master.xml