openapi: 3.0.3
info:
  title: Checklist Service API
  version: 1.0.0

tags:
  - name: Checklists
    description: Operations for managing checklists and their items

servers:
  - url: /

paths:

  /api/v1/checklists:
    get:
      tags: [Checklists]
      summary: Get all checklists for the authenticated user
      operationId: getChecklists
      security:
        - JWTAuth: []
      responses:
        '200':
          description: List of checklists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetChecklistsResponse'
        '401':
          description: Token either does not exist or is already expired
        '500':
          description: Unhandled error occurred

    post:
      tags: [Checklists]
      summary: Create a new checklist
      operationId: createChecklist
      security:
        - JWTAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChecklistRequest'
      responses:
        '201':
          description: Checklist created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateChecklistResponse'
        '400':
          description: Invalid request body
        '401':
          description: Token either does not exist or is already expired
        '500':
          description: Unhandled error occurred

  /api/v1/checklists/{id}:
    get:
      tags: [Checklists]
      summary: Get a checklist by ID including its items
      operationId: getChecklistById
      security:
        - JWTAuth: []
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: The checklist with its items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetChecklistResponse'
        '400':
          description: Invalid id parameter
        '401':
          description: Token either does not exist or is already expired
        '403':
          description: Accessing checklist of someone else
        '404':
          description: Checklist not found
        '500':
          description: Unhandled error occurred

    put:
      tags: [Checklists]
      summary: Update a checklist's title
      operationId: updateChecklist
      security:
        - JWTAuth: []
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateChecklistRequest'
      responses:
        '200':
          description: Updated checklist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateChecklistResponse'
        '400':
          description: Invalid id parameter or request body
        '401':
          description: Token either does not exist or is already expired
        '403':
          description: Accessing checklist of someone else
        '404':
          description: Checklist not found
        '500':
          description: Unhandled error occurred

    delete:
      tags: [Checklists]
      summary: Delete a checklist by ID
      operationId: deleteChecklist
      security:
        - JWTAuth: []
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: Checklist deleted
        '400':
          description: Invalid id parameter
        '401':
          description: Token either does not exist or is already expired
        '403':
          description: Accessing checklist of someone else
        '404':
          description: Checklist not found
        '500':
          description: Unhandled error occurred

  /api/v1/checklists/{id}/items:
    post:
      tags: [Checklists]
      summary: Add an item to a checklist
      operationId: addChecklistItem
      security:
        - JWTAuth: []
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddChecklistItemRequest'
      responses:
        '201':
          description: Item added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddChecklistItemResponse'
        '400':
          description: Invalid id parameter or request body
        '401':
          description: Token either does not exist or is already expired
        '403':
          description: Accessing checklist of someone else
        '404':
          description: Checklist not found
        '500':
          description: Unhandled error occurred

  /api/v1/checklists/{id}/items/{itemId}:
    put:
      tags: [Checklists]
      summary: Update a checklist item
      description: Can be used to change the text, toggle completed, or reorder
      operationId: updateChecklistItem
      security:
        - JWTAuth: []
      parameters:
        - $ref: '#/components/parameters/id'
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateChecklistItemRequest'
      responses:
        '200':
          description: Updated item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateChecklistItemResponse'
        '400':
          description: Invalid id/itemId parameter or request body
        '401':
          description: Token either does not exist or is already expired
        '403':
          description: Accessing checklist of someone else
        '404':
          description: Checklist or item not found
        '500':
          description: Unhandled error occurred

    delete:
      tags: [Checklists]
      summary: Remove an item from a checklist
      operationId: deleteChecklistItem
      security:
        - JWTAuth: []
      parameters:
        - $ref: '#/components/parameters/id'
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Item removed
        '400':
          description: Invalid id/itemId parameter
        '401':
          description: Token either does not exist or is already expired
        '403':
          description: Accessing checklist of someone else
        '404':
          description: Checklist or item not found
        '500':
          description: Unhandled error occurred

components:

  securitySchemes:
    JWTAuth:
      $ref: './common.yaml#/components/securitySchemes/JWTAuth'

  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64

  schemas:
    Checklist:
      type: object
      additionalProperties: true
      properties:
        userId:
          type: integer
          format: int64
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/IdentifiedChecklistItem'
    IdentifiedChecklist:
      type: object
      allOf:
        - $ref: './common.yaml#/components/schemas/Identifier'
        - $ref: '#/components/schemas/Checklist'

    ChecklistItem:
      type: object
      additionalProperties: true
      properties:
        text:
          type: string
        completed:
          type: boolean
        position:
          type: integer
    IdentifiedChecklistItem:
      type: object
      allOf:
        - $ref: './common.yaml#/components/schemas/Identifier'
        - $ref: '#/components/schemas/ChecklistItem'

    GetChecklistsResponse:
      type: object
      properties:
        checklists:
          type: array
          items:
            $ref: '#/components/schemas/IdentifiedChecklist'
      required:
        - checklists

    CreateChecklistRequest:
      allOf:
        - $ref: '#/components/schemas/Checklist'
        - type: object
          required:
            - title

    CreateChecklistResponse:
      allOf:
        - $ref: '#/components/schemas/IdentifiedChecklist'
        - type: object
          required:
            - title

    GetChecklistResponse:
      allOf:
        - $ref: '#/components/schemas/IdentifiedChecklist'
        - type: object
          required:
            - title

    UpdateChecklistRequest:
      allOf:
        - $ref: '#/components/schemas/Checklist'
        - type: object
          required:
            - title

    UpdateChecklistResponse:
      allOf:
        - $ref: '#/components/schemas/IdentifiedChecklist'
        - type: object
          required:
            - title

    AddChecklistItemRequest:
      allOf:
        - $ref: '#/components/schemas/ChecklistItem'
        - type: object
          required:
            - text

    AddChecklistItemResponse:
      allOf:
        - $ref: '#/components/schemas/IdentifiedChecklistItem'
        - type: object
          required:
            - text

    UpdateChecklistItemRequest:
      $ref: '#/components/schemas/ChecklistItem'

    UpdateChecklistItemResponse:
      allOf:
        - $ref: '#/components/schemas/IdentifiedChecklistItem'
        - type: object
          required:
            - text
