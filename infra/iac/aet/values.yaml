# ── Global ──────────────────────────────────────────────────────
global:
  namespace: team-devopss26-dev
  imageTag: latest
  imagePullPolicy: IfNotPresent

imageRegistry: team-devopss26

services:
  user-service:
    appPort: 8001
    contextPath: /api/user
    dbName: userdb
  admin-service:
    appPort: 8002
    contextPath: /api/admin
    dbName: admindb
  checklist-service:
    appPort: 8003
    contextPath: /api/checklist
    dbName: checklistdb
  calendar-service:
    appPort: 8004
    contextPath: /api/calendar
    dbName: calendardb
  note-service:
    appPort: 8005
    contextPath: /api/note
    dbName: notedb

client:
  replicaCount: 1
  image:
    repository: team-devopss26/client
    tag: latest    # still needed as fallback until template is fixed
    pullPolicy: IfNotPresent
  port: 80

genaiService:
  replicaCount: 1
  image:
    repository: team-devopss26/genai-service
    tag: latest
    pullPolicy: IfNotPresent
  appPort: 8006
  geminiApiKey: ""
  dbName: genaidb
  # TODO: Weaviate vector DB not yet deployed. The genai-service RAG feature
  # (sentence-transformers + weaviate-client) needs a Weaviate StatefulSet added
  # to the Helm chart. The service handles its absence gracefully (no RAG).
  resources:
    requests: { memory: "64Mi", cpu: "50m" }
    limits: { memory: "128Mi", cpu: "100m" }

postgres:
  user: admin
  password: admin
  persistence:
    size: 2Gi

ingress:
  enabled: true
  host: ""
  className: ""
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/hsts: "false"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    kubernetes.io/tls-acme: "true"
  tls:
    host: ""
    secretName: ""
