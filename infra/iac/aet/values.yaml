# ── Global ──────────────────────────────────────────────────────
global:
  namespace: team-devopss26-dev
  imageTag: latest
  imagePullPolicy: IfNotPresent

imageRegistry: team-devopss26

# Default resources for Java microservices
serviceResources:
  requests: { memory: "384Mi", cpu: "100m" }
  limits: { memory: "512Mi", cpu: "300m" }

services:
  user-service:
    appPort: 8001
    contextPath: /api/user
    dbName: userdb
  checklist-service:
    appPort: 8003
    contextPath: /api/checklist
    dbName: checklistdb
  calendar-service:
    appPort: 8004
    contextPath: /api/calendar
    dbName: calendardb
  note-service:
    appPort: 8005
    contextPath: /api/note
    dbName: notedb

client:
  replicaCount: 1
  image:
    repository: team-devopss26/client
    # NOTE: tag is unused — templates use .Values.global.imageTag
    pullPolicy: IfNotPresent
  port: 80
  resources:
    requests: { memory: "64Mi", cpu: "50m" }
    limits: { memory: "128Mi", cpu: "100m" }

genaiService:
  replicaCount: 1
  image:
    repository: team-devopss26/genai-service
    # NOTE: tag is unused — templates use .Values.global.imageTag
    pullPolicy: IfNotPresent
  appPort: 8006
  geminiApiKey: ""
  dbName: genaidb
  resources:
    requests: { memory: "256Mi", cpu: "100m" }
    limits: { memory: "512Mi", cpu: "200m" }

# ── Postgres ──
# NOTE: postgres.password is required for production — must be passed via --set or pre-created
#       as a Kubernetes Secret named 'postgres-secret' with key POSTGRES_PASSWORD.
#       For local dev (docker-compose), use the .env file in infra/.
postgres:
  user: admin
  password: ""    # REQUIRED for production — set via --set, not hardcoded
  persistence:
    size: 2Gi
  resources:
    requests: { memory: "256Mi", cpu: "100m" }
    limits: { memory: "512Mi", cpu: "200m" }

# ── Weaviate ──
weaviate:
  enabled: true
  replicaCount: 1
  image:
    repository: cr.weaviate.io/semitechnologies/weaviate
    tag: 1.25.6
  resources:
    requests: { memory: "256Mi", cpu: "100m" }
    limits: { memory: "512Mi", cpu: "500m" }
  persistence:
    size: 1Gi
  environment:
    # Disable auth for internal cluster communication
    AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
    PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
    ENABLE_MODULES: "text2vec-google"
    DEFAULT_VECTORIZER_MODULE: "none"
    # Disable rate limiting
    RATE_LIMIT_LIMIT: "0"
    RATE_LIMIT_POINT_LIMIT: "0"
    RATE_LIMIT_QUERY_LIMIT: "0"
    RATE_LIMIT_TIME_IN_S: "1"

ingress:
  enabled: true
  host: ""
  className: ""
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/hsts: "false"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    kubernetes.io/tls-acme: "true"
  tls:
    host: ""
    secretName: ""
