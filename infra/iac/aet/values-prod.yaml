# Production overrides for AET Rancher — namespace team-devopss26-prod
global:
  namespace: team-devopss26-prod
  imageTag: latest   # overridden by --set global.imageTag=${{ github.sha }} in CI
  imagePullPolicy: Always

imageRegistry: ghcr.io/aet-devops26/team-devopss26

client:
  image:
    repository: ghcr.io/aet-devops26/team-devopss26/client

genaiService:
  image:
    repository: ghcr.io/aet-devops26/team-devopss26/genai-service

ingress:
  enabled: true
  host: ""   # set via --set ingress.host=... at deploy time
  className: ""
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/hsts: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    kubernetes.io/tls-acme: "true"
  tls:
    host: ""
    secretName: "devopss26-tls"
