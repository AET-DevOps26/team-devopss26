# Production overrides for AET Rancher — helm install -f values-prod.yaml
# Only overrides what changes from local: registry, pull policy, and ingress.
# All service ports, context paths, and db names inherit from values.yaml.

global:
  imagePullSecrets:
    - name: ghcr-secret
  namespace: devopss26
  imageTag: latest
  imagePullPolicy: Always

imageRegistry: ghcr.io/aet-devops26/team-devopss26

client:
  image:
    repository: ghcr.io/aet-devops26/team-devopss26/client

genaiService:
  image:
    repository: ghcr.io/aet-devops26/team-devopss26/genai-service

ingress:
  enabled: true
  host: ""   # set via --set ingress.host=... at deploy time
  className: ""
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/hsts: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    kubernetes.io/tls-acme: "true"

  tls:
    host: ""
    secretName: "devopss26-tls"
