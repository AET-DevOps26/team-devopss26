# Production overrides for AET Rancher — namespace team-devopss26-prod
global:
  namespace: team-devopss26-prod
  imageTag: latest
  imagePullPolicy: Always

imageRegistry: ghcr.io/aet-devops26/team-devopss26

client:
  image:
    repository: ghcr.io/aet-devops26/team-devopss26/client

genaiService:
  image:
    repository: ghcr.io/aet-devops26/team-devopss26/genai-service

ingress:
  enabled: true
  host: ""   # set via --set ingress.host=... at deploy time
  className: "traefik"
  annotations: {}
  tls:
    host: ""
    secretName: ""
