apiVersion: v1
kind: ConfigMap
metadata:
  name: client-caddyfile
  namespace: {{ .Values.global.namespace }}
data:
  Caddyfile: |
    :80 {
        # ── Prod routes ──
        handle /api/v1/chat {
            reverse_proxy http://genai-service:{{ .Values.genaiService.appPort }}
        }
        handle /api/v1/chat/* {
            reverse_proxy http://genai-service:{{ .Values.genaiService.appPort }}
        }
        handle /api/genai/api/v1/chat {
            uri strip_prefix /api/genai
            reverse_proxy http://genai-service:{{ .Values.genaiService.appPort }}
        }
        handle /api/genai/api/v1/chat/* {
            uri strip_prefix /api/genai
            reverse_proxy http://genai-service:{{ .Values.genaiService.appPort }}
        }
        handle /api/v1/checklists {
            reverse_proxy http://checklist-service:{{ index .Values.services "checklist-service" "appPort" }}
        }
        handle /api/v1/checklists/* {
            reverse_proxy http://checklist-service:{{ index .Values.services "checklist-service" "appPort" }}
        }
        handle /api/v1/conversations {
            reverse_proxy http://genai-service:{{ .Values.genaiService.appPort }}
        }
        handle /api/v1/conversations/* {
            reverse_proxy http://genai-service:{{ .Values.genaiService.appPort }}
        }
        handle /api/genai/api/v1/conversations {
            uri strip_prefix /api/genai
            reverse_proxy http://genai-service:{{ .Values.genaiService.appPort }}
        }
        handle /api/genai/api/v1/conversations/* {
            uri strip_prefix /api/genai
            reverse_proxy http://genai-service:{{ .Values.genaiService.appPort }}
        }
        handle /api/v1/events {
            reverse_proxy http://calendar-service:{{ index .Values.services "calendar-service" "appPort" }}
        }
        handle /api/v1/events/* {
            reverse_proxy http://calendar-service:{{ index .Values.services "calendar-service" "appPort" }}
        }
        handle /api/v1/health {
            reverse_proxy http://genai-service:{{ .Values.genaiService.appPort }}
        }
        handle /api/v1/health/* {
            reverse_proxy http://genai-service:{{ .Values.genaiService.appPort }}
        }
        handle /api/genai/api/v1/health {
            uri strip_prefix /api/genai
            reverse_proxy http://genai-service:{{ .Values.genaiService.appPort }}
        }
        handle /api/genai/api/v1/health/* {
            uri strip_prefix /api/genai
            reverse_proxy http://genai-service:{{ .Values.genaiService.appPort }}
        }
        handle /api/genai/metrics {
            uri strip_prefix /api/genai
            reverse_proxy http://genai-service:{{ .Values.genaiService.appPort }}
        }
        handle /api/genai/metrics/* {
            uri strip_prefix /api/genai
            reverse_proxy http://genai-service:{{ .Values.genaiService.appPort }}
        }
        handle /api/v1/notes {
            reverse_proxy http://note-service:{{ index .Values.services "note-service" "appPort" }}
        }
        handle /api/v1/notes/* {
            reverse_proxy http://note-service:{{ index .Values.services "note-service" "appPort" }}
        }
        handle /api/v1/users/* {
            reverse_proxy http://user-service:{{ index .Values.services "user-service" "appPort" }}
        }

        # ── Monitoring routes (cross-namespace to monitoring) ──
        # Grafana: serve_from_sub_path=true, forward path as-is
        @grafana path /grafana /grafana/*
        handle @grafana {
            reverse_proxy http://grafana.team-devopss26-monitoring.svc.cluster.local:3000
        }

        # Prometheus: --web.external-url=/prometheus/ + --web.route-prefix=/,
        # serves at / internally, so strip prefix
        @prometheus path /prometheus /prometheus/*
        handle @prometheus {
            uri strip_prefix /prometheus
            reverse_proxy http://prometheus.team-devopss26-monitoring.svc.cluster.local:9090
        }

        # Serve swagger documentation directly
        handle /swagger* {
            root * /usr/share/caddy
            file_server
        }

        handle {
            root * /usr/share/caddy
            try_files {path} /index.html
            file_server
        }
    }
