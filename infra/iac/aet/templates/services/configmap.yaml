{{- $global := .Values.global }}
{{- $pg := .Values.postgres }}
{{- range $name, $cfg := .Values.services }}
{{- $prefix := replace "-" "_" $name | upper }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-config
  namespace: {{ $global.namespace }}
data:
  {{ $prefix }}_APP_PORT: "{{ $cfg.appPort }}"
  SERVICES_POSTGRES_URL: "postgres"
  SERVICES_POSTGRES_PORT_INT: "5432"
  SERVICES_POSTGRES_USER: "{{ $pg.user }}"
  {{- if or (eq $name "calendar-service") (eq $name "note-service") (eq $name "checklist-service") }}
  USER_SERVICE_URL: "http://user-service:{{ index $.Values.services "user-service" "appPort" }}"
  {{- end }}
{{- end }}