{{- $global := .Values.global }}
{{- $imageRegistry := .Values.imageRegistry }}
{{- range $name, $cfg := .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $global.namespace }}
  labels:
    app: {{ $name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
    spec:
      {{- with $global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: "{{ $imageRegistry }}/{{ $name }}:{{ $global.imageTag }}"
          imagePullPolicy: {{ $global.imagePullPolicy }}
          ports:
            - containerPort: {{ $cfg.appPort }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          envFrom:
            - configMapRef:
                name: {{ $name }}-config
            - secretRef:
                name: {{ $name }}-secret
          livenessProbe:
            tcpSocket:
              port: {{ $cfg.appPort }}
            initialDelaySeconds: 90
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: {{ $cfg.appPort }}
            initialDelaySeconds: 90
            periodSeconds: 5
          resources:
            requests: { memory: "256Mi", cpu: "50m" }
            limits: { memory: "384Mi", cpu: "150m" }
{{- end }}