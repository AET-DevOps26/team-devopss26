apiVersion: apps/v1
kind: Deployment
metadata:
  name: genai-service
  namespace: {{ .Values.global.namespace }}
  labels:
    app: genai-service
spec:
  replicas: {{ .Values.genaiService.replicaCount }}
  selector:
    matchLabels:
      app: genai-service
  template:
    metadata:
      labels:
        app: genai-service
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: genai-service
          image: "{{ .Values.genaiService.image.repository }}:{{ .Values.genaiService.image.tag }}"
          imagePullPolicy: {{ .Values.genaiService.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.genaiService.appPort }}
          envFrom:
            - configMapRef:
                name: genai-service-config
            - secretRef:
                name: genai-service-secret
          livenessProbe:
            tcpSocket:
              port: {{ .Values.genaiService.appPort }}
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: {{ .Values.genaiService.appPort }}
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            {{- toYaml .Values.genaiService.resources | nindent 12 }}