apiVersion: v1
kind: ConfigMap
metadata:
  name: genai-service-config
  namespace: {{ .Values.global.namespace }}
data:
  GENAI_SERVICE_APP_PORT: "{{ .Values.genaiService.appPort }}"
  SERVICES_POSTGRES_URL: "postgres"
  SERVICES_POSTGRES_PORT_INT: "5432"
  SERVICES_POSTGRES_DB: "{{ .Values.genaiService.dbName }}"
  SERVICES_POSTGRES_USER: "{{ .Values.postgres.user }}"
  USER_SERVICE_URL: "http://user-service:8001"
  NOTE_SERVICE_URL: "http://note-service:8005"
  CALENDAR_SERVICE_URL: "http://calendar-service:8004"
  CHECKLIST_SERVICE_URL: "http://checklist-service:8003"
  WEAVIATE_HOST: "weaviate"
  # No Ollama container is provisioned in k8s, so this deployment defaults to Gemini.
  DEFAULT_LLM_MODEL: "gemini"
