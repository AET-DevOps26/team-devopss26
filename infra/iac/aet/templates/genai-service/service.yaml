apiVersion: v1
kind: Service
metadata:
  name: genai-service
  namespace: {{ .Values.global.namespace }}
  labels:
    app: genai-service
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.genaiService.appPort }}
      targetPort: {{ .Values.genaiService.appPort }}
      protocol: TCP
  selector:
    app: genai-service