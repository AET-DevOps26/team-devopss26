---
- hosts: all
  become: yes
  tasks:
    - name: Update apt package index and install prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        update_cache: yes

    - name: Create directory for apt keyrings
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download and de-armor Docker's official GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'
        force: true

    - name: Add Docker repository to Apt sources
      ansible.builtin.apt_repository:
        repo: "deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else ansible_architecture }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Install Docker Engine and plugins
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        update_cache: yes

    - name: Add admin user to the docker group
      ansible.builtin.user:
        name: devops-admin
        groups: docker
        append: yes

    - name: Ensure Docker service is started and enabled
      ansible.builtin.service:
        name: docker
        state: started
        enabled: yes
        
    - name: Install git and pip3
      ansible.builtin.apt:
        name:
          - git
          - python3-pip
        state: present

    - name: Install Docker module for Python
      ansible.builtin.pip:
        name:
          - docker
          - docker-compose
        state: present
        
    - name: Ensure app directory exists on VM
      ansible.builtin.file:
        path: /home/devops-admin/app
        state: directory
        owner: devops-admin
        group: devops-admin
        mode: '0755'

    - name: Copy docker-compose.yml to VM
      ansible.builtin.copy:
        src: ../../docker-compose.yml
        dest: /home/devops-admin/app/docker-compose.yml
        owner: devops-admin
        group: devops-admin
        mode: '0644'

    - name: Copy .env file to VM
      ansible.builtin.copy:
        src: ../../.env
        dest: /home/devops-admin/app/.env
        owner: devops-admin
        group: devops-admin
        mode: '0600'

    - name: Ensure init-db directory exists on VM
      ansible.builtin.file:
        path: /home/devops-admin/app/init-db
        state: directory
        owner: devops-admin
        group: devops-admin
        mode: '0755'

    - name: Copy 01-init-databases.sh to VM
      ansible.builtin.copy:
        src: ../../init-db/01-init-databases.sh
        dest: /home/devops-admin/app/init-db/01-init-databases.sh
        owner: devops-admin
        group: devops-admin
        mode: '0755'

    - name: Ensure genai-service changelog directory exists on VM
      ansible.builtin.file:
        path: /home/devops-admin/services/genai-service/db/changelog
        state: directory
        owner: devops-admin
        group: devops-admin
        mode: '0755'

    - name: Copy genai-service changelogs to VM
      ansible.builtin.copy:
        src: ../../../services/genai-service/db/changelog/
        dest: /home/devops-admin/services/genai-service/db/changelog/
        owner: devops-admin
        group: devops-admin
        mode: '0644'

    - name: Ensure prometheus directory exists on VM
      ansible.builtin.file:
        path: /home/devops-admin/app/prometheus
        state: directory
        owner: devops-admin
        group: devops-admin
        mode: '0755'

    - name: Ensure any existing directory named prometheus.yml is removed
      ansible.builtin.file:
        path: /home/devops-admin/app/prometheus/prometheus.yml
        state: absent

    - name: Copy prometheus.yml to VM
      ansible.builtin.copy:
        src: ../../prometheus/prometheus.yml
        dest: /home/devops-admin/app/prometheus/prometheus.yml
        owner: devops-admin
        group: devops-admin
        mode: '0644'
      notify: Restart Prometheus

    - name: Stop any running compose stack to release file/directory holds
      ansible.builtin.shell: |
        cd /home/devops-admin/app
        docker compose down --remove-orphans 2>&1 || true
      changed_when: True

    - name: Force prometheus rules.yml to be a regular file on VM
      ansible.builtin.shell: |
        rm -rf /home/devops-admin/app/prometheus/rules.yml
        touch /home/devops-admin/app/prometheus/rules.yml
        chown devops-admin:devops-admin /home/devops-admin/app/prometheus/rules.yml
        chmod 0644 /home/devops-admin/app/prometheus/rules.yml
      changed_when: True

    - name: Copy prometheus rules.yml to VM
      ansible.builtin.copy:
        src: ../../prometheus/rules.yml
        dest: /home/devops-admin/app/prometheus/rules.yml
        owner: devops-admin
        group: devops-admin
        mode: '0644'
      notify: Restart Prometheus


    - name: Ensure grafana directory exists on VM
      ansible.builtin.file:
        path: /home/devops-admin/app/grafana
        state: directory
        owner: devops-admin
        group: devops-admin
        mode: '0755'

    - name: Copy grafana provisioning to VM
      ansible.builtin.copy:
        src: ../../grafana/provisioning/
        dest: /home/devops-admin/app/grafana/provisioning/
        owner: devops-admin
        group: devops-admin
        mode: '0644'
        directory_mode: '0755'
      notify: Restart Grafana

    - name: Copy grafana dashboards to VM
      ansible.builtin.copy:
        src: ../../grafana/dashboards/
        dest: /home/devops-admin/app/grafana/dashboards/
        owner: devops-admin
        group: devops-admin
        mode: '0644'
        directory_mode: '0755'
      notify: Restart Grafana

    - name: Pull fresh service images from registry
      ansible.builtin.command:
        cmd: docker compose pull
        chdir: /home/devops-admin/app
      become: yes
      become_user: devops-admin
      changed_when: true

    - name: Start application with Docker Compose (no build)
      community.docker.docker_compose_v2:
        project_src: /home/devops-admin/app
        state: present
        pull: missing
        build: never
        remove_orphans: true
      become: yes
      become_user: devops-admin
      environment:
        BUILDKIT_NUMBER_OF_THREADS: "1"

  handlers:
    - name: Restart Prometheus
      community.docker.docker_compose_v2:
        project_src: /home/devops-admin/app
        services:
          - prometheus
        state: restarted
      become: yes
      become_user: devops-admin
      environment:
        BUILDKIT_NUMBER_OF_THREADS: "1"

    - name: Restart Grafana
      community.docker.docker_compose_v2:
        project_src: /home/devops-admin/app
        services:
          - grafana
        state: restarted
      become: yes
      become_user: devops-admin
      environment:
        BUILDKIT_NUMBER_OF_THREADS: "1"