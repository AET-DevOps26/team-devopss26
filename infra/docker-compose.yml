# --- VOLUMES & NETWORKS ---
# Define the volumes and networks used by the services.
volumes:
  user-service-db: {}
  admin-service-db: {}
  checklist-service-db: {}
  calendar-service-db: {}
  note-service-db: {}

networks:
  user-service-net: {}
  admin-service-net: {}
  checklist-service-net: {}
  calendar-service-net: {}
  note-service-net: {}