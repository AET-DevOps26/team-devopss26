# --- TEMPLATES ---
# Define common configurations for services to reduce duplication.
x-db-template: &db-template
  image: postgres:12.8
  env_file: .env
  command: -p 5432
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -p 5432 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
    interval: 10s
    timeout: 5s
    retries: 5

x-app-template: &app-template
  env_file: .env
  build:
    dockerfile: Dockerfile

# --- SERVICES ---
# Define the actual services using the templates above.
services:
  #####################################################################################################
  # USER SERVICE
  #####################################################################################################
  user-service-db:
    <<: *db-template
    container_name: user-service-db
    environment:
      POSTGRES_USER: ${USER_SERVICE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${USER_SERVICE_POSTGRES_PASSWORD}
      POSTGRES_DB: ${USER_SERVICE_POSTGRES_DB}
    ports:
      - "${USER_SERVICE_POSTGRES_PORT_EXT}:5432"
    volumes:
      - user-service-db:/var/lib/postgresql/data
    networks:
      - user-service-net

  user-service-app:
    <<: *app-template
    container_name: user-service-app
    build:
      context: ../services/user-service
    ports:
      - "${USER_SERVICE_APP_PORT}:${USER_SERVICE_APP_PORT}"
    networks:
      - user-service-net
    depends_on:
      user-service-db:
        condition: service_healthy

  #####################################################################################################
  # ADMIN SERVICE
  #####################################################################################################
  admin-service-db:
    <<: *db-template
    container_name: admin-service-db
    environment:
      POSTGRES_USER: ${ADMIN_SERVICE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${ADMIN_SERVICE_POSTGRES_PASSWORD}
      POSTGRES_DB: ${ADMIN_SERVICE_POSTGRES_DB}
    ports:
      - "${ADMIN_SERVICE_POSTGRES_PORT_EXT}:5432"
    volumes:
      - admin-service-db:/var/lib/postgresql/data
    networks:
      - admin-service-net

  admin-service-app:
    <<: *app-template
    container_name: admin-service-app
    build:
      context: ../services/admin-service
    ports:
      - "${ADMIN_SERVICE_APP_PORT}:${ADMIN_SERVICE_APP_PORT}"
    networks:
      - admin-service-net
    depends_on:
      admin-service-db:
        condition: service_healthy

  #####################################################################################################
  # CHECKLIST SERVICE
  #####################################################################################################
  checklist-service-db:
    <<: *db-template
    container_name: checklist-service-db
    environment:
      POSTGRES_USER: ${CHECKLIST_SERVICE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${CHECKLIST_SERVICE_POSTGRES_PASSWORD}
      POSTGRES_DB: ${CHECKLIST_SERVICE_POSTGRES_DB}
    ports:
      - "${CHECKLIST_SERVICE_POSTGRES_PORT_EXT}:5432"
    volumes:
      - checklist-service-db:/var/lib/postgresql/data
    networks:
      - checklist-service-net

  checklist-service-app:
    <<: *app-template
    container_name: checklist-service-app
    build:
      context: ../services/checklist-service
    ports:
      - "${CHECKLIST_SERVICE_APP_PORT}:${CHECKLIST_SERVICE_APP_PORT}"
    networks:
      - checklist-service-net
    depends_on:
      checklist-service-db:
        condition: service_healthy

  #####################################################################################################
  # CALENDAR SERVICE
  #####################################################################################################
  calendar-service-db:
    <<: *db-template
    container_name: calendar-service-db
    environment:
      POSTGRES_USER: ${CALENDAR_SERVICE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${CALENDAR_SERVICE_POSTGRES_PASSWORD}
      POSTGRES_DB: ${CALENDAR_SERVICE_POSTGRES_DB}
    ports:
      - "${CALENDAR_SERVICE_POSTGRES_PORT_EXT}:5432"
    volumes:
      - calendar-service-db:/var/lib/postgresql/data
    networks:
      - calendar-service-net

  calendar-service-app:
    <<: *app-template
    container_name: calendar-service-app
    build:
      context: ../services/calendar-service
    ports:
      - "${CALENDAR_SERVICE_APP_PORT}:${CALENDAR_SERVICE_APP_PORT}"
    networks:
      - calendar-service-net
    depends_on:
      calendar-service-db:
        condition: service_healthy

  #####################################################################################################
  # NOTE SERVICE
  #####################################################################################################
  note-service-db:
    <<: *db-template
    container_name: note-service-db
    environment:
      POSTGRES_USER: ${NOTE_SERVICE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${NOTE_SERVICE_POSTGRES_PASSWORD}
      POSTGRES_DB: ${NOTE_SERVICE_POSTGRES_DB}
    ports:
      - "${NOTE_SERVICE_POSTGRES_PORT_EXT}:5432"
    volumes:
      - note-service-db:/var/lib/postgresql/data
    networks:
      - note-service-net

  note-service-app:
    <<: *app-template
    container_name: note-service-app
    build:
      context: ../services/note-service
    ports:
      - "${NOTE_SERVICE_APP_PORT}:${NOTE_SERVICE_APP_PORT}"
    networks:
      - note-service-net
    depends_on:
      note-service-db:
        condition: service_healthy

  #####################################################################################################
  # GENAI SERVICE
  #####################################################################################################
  genai-service-db:
    <<: *db-template
    container_name: genai-service-db
    environment:
      POSTGRES_USER: ${GENAI_SERVICE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${GENAI_SERVICE_POSTGRES_PASSWORD}
      POSTGRES_DB: ${GENAI_SERVICE_POSTGRES_DB}
    ports:
      - "${GENAI_SERVICE_POSTGRES_PORT_EXT}:5432"
    volumes:
      - genai-service-db:/var/lib/postgresql/data
    networks:
      - genai-service-net

  genai-service-liquibase:
    image: liquibase/liquibase:4.29
    env_file: .env
    container_name: genai-service-liquibase
    depends_on:
      genai-service-db:
        condition: service_healthy
    volumes:
      - ../services/genai-service/db/changelog:/liquibase/changelog
    command:
      - --url=jdbc:postgresql://${GENAI_SERVICE_POSTGRES_URL}:${GENAI_SERVICE_POSTGRES_PORT_INT}/${GENAI_SERVICE_POSTGRES_DB}
      - --username=${GENAI_SERVICE_POSTGRES_USER}
      - --password=${GENAI_SERVICE_POSTGRES_PASSWORD}
      - --changeLogFile=db.changelog-master.xml
      - --searchPath=/liquibase/changelog
      - update
    networks:
      - genai-service-net
    depends_on:
      genai-service-db:
        condition: service_healthy

  genai-service-app:
    <<: *app-template
    container_name: genai-service-app
    build:
      context: ../services/genai-service
    ports:
      - "${GENAI_SERVICE_APP_PORT}:${GENAI_SERVICE_APP_PORT}"
    networks:
      - genai-service-net
    depends_on:
      genai-service-liquibase:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${GENAI_SERVICE_APP_PORT}/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  #####################################################################################################
  # FRONTEND SERVICE
  #####################################################################################################
  client:
    container_name: client
    build:
      context: ../web-client
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api}
    ports:
      - "${CLIENT_PORT:-3000}:80"
    networks:
      - client-net

# --- VOLUMES & NETWORKS ---
# Define the volumes and networks used by the services.
volumes:
  user-service-db: {}
  admin-service-db: {}
  checklist-service-db: {}
  calendar-service-db: {}
  note-service-db: {}
  genai-service-db: {}

networks:
  user-service-net: {}
  admin-service-net: {}
  checklist-service-net: {}
  calendar-service-net: {}
  note-service-net: {}
  genai-service-net: {}
  client-net: {}