# --- TEMPLATES ---
# Define common configurations for services to reduce duplication.
x-db-template: &db-template
  image: postgres:12.8
  env_file: .env
  command: -p 5432
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -p 5432 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
    interval: 10s
    timeout: 5s
    retries: 5

x-app-template: &app-template
  env_file: .env
  mem_limit: 450m
  environment:
    - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=75.0 -XX:+UseSerialGC -Xss256k

# --- SERVICES ---
# Define the actual services using the templates above.
services:
  #####################################################################################################
  # USER SERVICE
  #####################################################################################################
  services-db:
    <<: *db-template
    container_name: services-db
    environment:
      POSTGRES_USER: ${SERVICES_POSTGRES_USER}
      POSTGRES_PASSWORD: ${SERVICES_POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      POSTGRES_MULTIPLE_DATABASES: user_service_db,checklist_service_db,calendar_service_db,note_service_db,genai_service_db
    ports:
      - "${SERVICES_POSTGRES_PORT_EXT}:5432"
    volumes:
      - services-db:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    networks:
      - calendar-service-net
      - checklist-service-net
      - client-net
      - genai-service-net
      - note-service-net
      - user-service-net

  user-service-app:
    <<: *app-template
    image: ghcr.io/aet-devops26/team-devopss26/user-service:7435acd8700e13487e824899ffaa5df167e53792
    container_name: user-service-app
    build:
      context: ..
      dockerfile: services/user-service/Dockerfile
    ports:
      - "${USER_SERVICE_APP_PORT}:${USER_SERVICE_APP_PORT}"
    networks:
      - user-service-net
      - internal-net
      - monitoring-net
    depends_on:
      services-db:
        condition: service_healthy

  #####################################################################################################
  # CHECKLIST SERVICE
  #####################################################################################################
  checklist-service-app:
    <<: *app-template
    image: ghcr.io/aet-devops26/team-devopss26/checklist-service:7435acd8700e13487e824899ffaa5df167e53792
    container_name: checklist-service-app
    build:
      context: ..
      dockerfile: services/checklist-service/Dockerfile
    ports:
      - "${CHECKLIST_SERVICE_APP_PORT}:${CHECKLIST_SERVICE_APP_PORT}"
    networks:
      - checklist-service-net
      - internal-net
      - monitoring-net
    depends_on:
      services-db:
        condition: service_healthy

  #####################################################################################################
  # CALENDAR SERVICE
  #####################################################################################################
  calendar-service-app:
    <<: *app-template
    image: ghcr.io/aet-devops26/team-devopss26/calendar-service:7435acd8700e13487e824899ffaa5df167e53792
    container_name: calendar-service-app
    build:
      context: ..
      dockerfile: services/calendar-service/Dockerfile
    ports:
      - "${CALENDAR_SERVICE_APP_PORT}:${CALENDAR_SERVICE_APP_PORT}"
    networks:
      - calendar-service-net
      - internal-net
      - monitoring-net
    depends_on:
      services-db:
        condition: service_healthy

  #####################################################################################################
  # NOTE SERVICE
  #####################################################################################################
  note-service-app:
    <<: *app-template
    image: ghcr.io/aet-devops26/team-devopss26/note-service:7435acd8700e13487e824899ffaa5df167e53792
    container_name: note-service-app
    build:
      context: ..
      dockerfile: services/note-service/Dockerfile
    ports:
      - "${NOTE_SERVICE_APP_PORT}:${NOTE_SERVICE_APP_PORT}"
    networks:
      - note-service-net
      - internal-net
      - monitoring-net
    depends_on:
      services-db:
        condition: service_healthy

  #####################################################################################################
  # GENAI SERVICE
  #####################################################################################################
  genai-service-liquibase:
    image: liquibase/liquibase:4.29
    env_file: .env
    container_name: genai-service-liquibase
    volumes:
      - ../services/genai-service/db/changelog:/liquibase/changelog
    command:
      - --url=jdbc:postgresql://${SERVICES_POSTGRES_URL}:${SERVICES_POSTGRES_PORT_INT}/genai_service_db
      - --username=${SERVICES_POSTGRES_USER}
      - --password=${SERVICES_POSTGRES_PASSWORD}
      - --changeLogFile=db.changelog-master.xml
      - --searchPath=/liquibase/changelog
      - update
    networks:
      - genai-service-net
    depends_on:
      services-db:
        condition: service_healthy

  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.27.0
    container_name: weaviate
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      ENABLE_MODULES: ""
      CLUSTER_HOSTNAME: node1
    volumes:
      - weaviate-data:/var/lib/weaviate
    networks:
      - genai-service-net

  genai-service-app:
    <<: *app-template
    image: ghcr.io/aet-devops26/team-devopss26/genai-service:7435acd8700e13487e824899ffaa5df167e53792
    container_name: genai-service-app
    build:
      context: ..
      dockerfile: services/genai-service/Dockerfile
    ports:
      - "${GENAI_SERVICE_APP_PORT}:${GENAI_SERVICE_APP_PORT}"
    networks:
      - genai-service-net
      - internal-net
      - monitoring-net
    depends_on:
      genai-service-liquibase:
        condition: service_completed_successfully
      weaviate:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; exit(0 if urllib.request.urlopen('http://localhost:${GENAI_SERVICE_APP_PORT}/api/v1/health').status == 200 else 1)\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  #####################################################################################################
  # FRONTEND SERVICE
  #####################################################################################################
  client:
    container_name: client
    build:
      context: ..
      dockerfile: web-client/Dockerfile
    ports:
      - "${CLIENT_PORT:-80}:80"
    networks:
      - client-net
      - user-service-net
      - internal-net

  #####################################################################################################
  # OBSERVABILITY
  #####################################################################################################
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - monitoring-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - monitoring-net

# --- VOLUMES & NETWORKS ---
# Define the volumes and networks used by the services.
volumes:
  weaviate-data: {}
  services-db: {}
  prometheus-data: {}
  grafana-data: {}

networks:
  user-service-net: {}
  checklist-service-net: {}
  calendar-service-net: {}
  note-service-net: {}
  genai-service-net: {}
  client-net: {}
  internal-net: {}
  monitoring-net: {}
