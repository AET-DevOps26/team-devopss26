# --- TEMPLATES ---
# Define common configurations for services to reduce duplication.
x-db-template: &db-template
  image: postgres:12.8
  env_file: .env
  command: -p 5432
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -p 5432 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
    interval: 10s
    timeout: 5s
    retries: 5

x-app-template: &app-template
  env_file: .env
  mem_limit: 450m
  environment:
    - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=75.0 -XX:+UseSerialGC -Xss256k

# --- SERVICES ---
# Define the actual services using the templates above.
services:
  #####################################################################################################
  # USER SERVICE
  #####################################################################################################
  services-db:
    <<: *db-template
    container_name: services-db
    environment:
      POSTGRES_USER: ${SERVICES_POSTGRES_USER}
      POSTGRES_PASSWORD: ${SERVICES_POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      POSTGRES_MULTIPLE_DATABASES: user_service_db,admin_service_db,checklist_service_db,calendar_service_db,note_service_db,genai_service_db
    ports:
      - "${SERVICES_POSTGRES_PORT_EXT}:5432"
    volumes:
      - services-db:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    networks:
      - admin-service-net
      - calendar-service-net
      - checklist-service-net
      - client-net
      - genai-service-net
      - note-service-net
      - user-service-net

  user-service-app:
    <<: *app-template
    image: ghcr.io/aet-devops26/team-devopss26/user-service:7435acd8700e13487e824899ffaa5df167e53792
    container_name: user-service-app
    build:
      context: ..
      dockerfile: services/user-service/Dockerfile
    ports:
      - "${USER_SERVICE_APP_PORT}:${USER_SERVICE_APP_PORT}"
    networks:
      - user-service-net
    depends_on:
      services-db:
        condition: service_healthy

  #####################################################################################################
  # ADMIN SERVICE
  #####################################################################################################
  admin-service-app:
    <<: *app-template
    image: ghcr.io/aet-devops26/team-devopss26/admin-service:7435acd8700e13487e824899ffaa5df167e53792
    container_name: admin-service-app
    build:
      context: ..
      dockerfile: services/admin-service/Dockerfile
    ports:
      - "${ADMIN_SERVICE_APP_PORT}:${ADMIN_SERVICE_APP_PORT}"
    networks:
      - admin-service-net
    depends_on:
      services-db:
        condition: service_healthy

  #####################################################################################################
  # CHECKLIST SERVICE
  #####################################################################################################
  checklist-service-app:
    <<: *app-template
    image: ghcr.io/aet-devops26/team-devopss26/checklist-service:7435acd8700e13487e824899ffaa5df167e53792
    container_name: checklist-service-app
    build:
      context: ..
      dockerfile: services/checklist-service/Dockerfile
    ports:
      - "${CHECKLIST_SERVICE_APP_PORT}:${CHECKLIST_SERVICE_APP_PORT}"
    networks:
      - checklist-service-net
    depends_on:
      services-db:
        condition: service_healthy

  #####################################################################################################
  # CALENDAR SERVICE
  #####################################################################################################
  calendar-service-app:
    <<: *app-template
    image: ghcr.io/aet-devops26/team-devopss26/calendar-service:7435acd8700e13487e824899ffaa5df167e53792
    container_name: calendar-service-app
    build:
      context: ..
      dockerfile: services/calendar-service/Dockerfile
    ports:
      - "${CALENDAR_SERVICE_APP_PORT}:${CALENDAR_SERVICE_APP_PORT}"
    networks:
      - calendar-service-net
    depends_on:
      services-db:
        condition: service_healthy

  #####################################################################################################
  # NOTE SERVICE
  #####################################################################################################
  note-service-app:
    <<: *app-template
    image: ghcr.io/aet-devops26/team-devopss26/note-service:7435acd8700e13487e824899ffaa5df167e53792
    container_name: note-service-app
    build:
      context: ..
      dockerfile: services/note-service/Dockerfile
    ports:
      - "${NOTE_SERVICE_APP_PORT}:${NOTE_SERVICE_APP_PORT}"
    networks:
      - note-service-net
    depends_on:
      services-db:
        condition: service_healthy

  #####################################################################################################
  # GENAI SERVICE
  #####################################################################################################
  genai-service-liquibase:
    image: liquibase/liquibase:4.29
    env_file: .env
    container_name: genai-service-liquibase
    volumes:
      - ../services/genai-service/db/changelog:/liquibase/changelog
    command:
      - --url=jdbc:postgresql://${SERVICES_POSTGRES_URL}:${SERVICES_POSTGRES_PORT_INT}/genai_service_db
      - --username=${SERVICES_POSTGRES_USER}
      - --password=${SERVICES_POSTGRES_PASSWORD}
      - --changeLogFile=db.changelog-master.xml
      - --searchPath=/liquibase/changelog
      - update
    networks:
      - genai-service-net
    depends_on:
      services-db:
        condition: service_healthy

  genai-service-app:
    <<: *app-template
    image: ghcr.io/aet-devops26/team-devopss26/genai-service:7435acd8700e13487e824899ffaa5df167e53792
    container_name: genai-service-app
    build:
      context: ../services/genai-service
    ports:
      - "${GENAI_SERVICE_APP_PORT}:${GENAI_SERVICE_APP_PORT}"
    networks:
      - genai-service-net
    depends_on:
      genai-service-liquibase:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${GENAI_SERVICE_APP_PORT}/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  #####################################################################################################
  # FRONTEND SERVICE
  #####################################################################################################
  client:
    container_name: client
    build:
      context: ..
      dockerfile: web-client/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api}
    ports:
      - "${CLIENT_PORT:-80}:80"
    networks:
      - client-net

# --- VOLUMES & NETWORKS ---
# Define the volumes and networks used by the services.
volumes:
  services-db: {}

networks:
  user-service-net: {}
  admin-service-net: {}
  checklist-service-net: {}
  calendar-service-net: {}
  note-service-net: {}
  genai-service-net: {}
  client-net: {}