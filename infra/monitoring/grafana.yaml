apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: team-devopss26-monitoring
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://prometheus.team-devopss26-monitoring.svc.cluster.local:9090
        access: proxy
        isDefault: true
