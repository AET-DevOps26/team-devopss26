---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: team-devopss26-monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    rule_files:
      - /etc/prometheus/rules.yml

    scrape_configs:
      - job_name: 'user-service'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['user-service.team-devopss26-prod.svc.cluster.local:8001']
      - job_name: 'checklist-service'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['checklist-service.team-devopss26-prod.svc.cluster.local:8003']
      - job_name: 'calendar-service'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['calendar-service.team-devopss26-prod.svc.cluster.local:8004']
      - job_name: 'note-service'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['note-service.team-devopss26-prod.svc.cluster.local:8005']
      - job_name: 'genai-service'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['genai-service.team-devopss26-prod.svc.cluster.local:8006']
  rules.yml: |
    groups:
      - name: service-availability
        rules:
          - alert: ServiceDown
            expr: up{job=~"user-service|checklist-service|calendar-service|note-service|genai-service"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Service {{ $labels.job }} is down"
              description: "Prometheus has been unable to scrape {{ $labels.job }} ({{ $labels.instance }}) for more than 1 minute."
      - name: service-latency
        rules:
          - alert: HighLatencyJavaService
            expr: histogram_quantile(0.95, sum by (job, le) (rate(http_server_requests_seconds_bucket{job=~"user-service|checklist-service|calendar-service|note-service"}[5m]))) > 2
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High p95 latency on {{ $labels.job }}"
              description: "95th percentile request latency for {{ $labels.job }} has been above 2s for 5 minutes (current: {{ $value | printf \"%.2f\" }}s)."
          - alert: HighLatencyGenAI
            expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{job="genai-service"}[5m]))) > 5
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High p95 latency on genai-service"
              description: "95th percentile request latency for genai-service has been above 5s for 5 minutes (current: {{ $value | printf \"%.2f\" }}s)."
      - name: service-errors
        rules:
          - alert: HighErrorRateJavaService
            expr: |
              100 * sum by (job) (rate(http_server_requests_seconds_count{job=~"user-service|checklist-service|calendar-service|note-service", outcome="SERVER_ERROR"}[5m]))
              / clamp_min(sum by (job) (rate(http_server_requests_seconds_count{job=~"user-service|checklist-service|calendar-service|note-service"}[5m])), 1) > 5
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High 5xx error rate on {{ $labels.job }}"
              description: "{{ $labels.job }} has been returning more than 5% server errors for 5 minutes (current: {{ $value | printf \"%.1f\" }}%)."
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: team-devopss26-monitoring
  labels:
    app: prometheus
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --web.external-url=/prometheus/
            - --web.route-prefix=/
          ports:
            - containerPort: 9090
          resources:
            requests: { memory: "256Mi", cpu: "100m" }
            limits:   { memory: "384Mi", cpu: "256m" }
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            - name: config
              mountPath: /etc/prometheus/rules.yml
              subPath: rules.yml
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: team-devopss26-monitoring
  labels:
    app: prometheus
spec:
  type: ClusterIP
  ports:
    - port: 9090
      targetPort: 9090
  selector:
    app: prometheus
